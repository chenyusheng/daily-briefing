<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>佛山 40 问 · 手机速查版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f4f5f7;color:#1a2333;padding:0 0 40px;line-height:1.6;}
  .wrap{max-width:640px;margin:0 auto;}
  .hero{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;padding:22px 18px 20px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .hero h1{font-size:1.25rem;}
  .hero .sub{font-size:.85rem;opacity:.92;margin-top:4px;}
  .bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:#fbbf24;border-radius:4px;transition:width .3s;}
  .hero .count{font-size:.8rem;margin-top:6px;opacity:.95;}
  .toolbar{display:flex;gap:8px;padding:10px 16px;background:#eef0f4;position:sticky;top:132px;z-index:9;}
  .toolbar button{flex:1;border:1px solid #cbd2e0;background:#fff;color:#1e40af;border-radius:20px;padding:8px 0;font-size:.85rem;font-weight:600;}
  .tips{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;margin:12px 16px;padding:12px 14px;font-size:.88rem;}
  .tips b{color:#92400e;}
  section{background:#fff;border:1px solid #e5e9f0;border-radius:12px;margin:10px 16px;overflow:hidden;}
  section>h2{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;font-size:1rem;cursor:pointer;user-select:none;}
  section>h2 .t{display:flex;align-items:center;gap:8px;}
  section>h2 .badge{font-size:.72rem;color:#2563eb;background:#eef4ff;border-radius:10px;padding:1px 8px;white-space:nowrap;}
  section>h2 .arrow{color:#94a3b8;font-size:.8rem;transition:transform .2s;}
  section.closed>h2 .arrow{transform:rotate(-90deg);}
  section.closed .body{display:none;}
  .body{padding:4px 6px 10px;border-top:1px dashed #e5e9f0;}
  ol{list-style:none;}
  li{display:flex;gap:10px;padding:11px 10px;border-bottom:1px solid #f1f3f7;font-size:.95rem;align-items:flex-start;}
  li:last-child{border-bottom:none;}
  li.done{color:#94a3b8;text-decoration:line-through;text-decoration-color:#cbd2e0;}
  .ck{flex-shrink:0;width:22px;height:22px;border:2px solid #cbd2e0;border-radius:6px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;background:#fff;}
  li.done .ck{background:#10b981;border-color:#10b981;}
  .star{color:#f59e0b;font-size:.8rem;margin-left:4px;}
  .num{flex-shrink:0;color:#64748b;font-size:.8rem;margin-top:3px;width:20px;text-align:right;}
  .note{margin:14px 16px;}
  .note textarea{width:100%;min-height:90px;border:1px solid #cbd2e0;border-radius:10px;padding:10px;font-size:.9rem;font-family:inherit;background:#fff;}
  .foot{text-align:center;color:#64748b;font-size:.78rem;margin-top:16px;padding:0 20px;}
  .foot .big{font-size:.9rem;color:#1e40af;font-weight:600;}
</style>
</head>
<body>
<div class="wrap">

<div class="hero">
  <h1>🤝 佛山同行拜访 · 40 问速查</h1>
  <div class="sub">白牌贴牌女装卖家取经 · 问完打勾，进度自动保存</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="count" id="count">已问 0 / 40</div>
</div>

<div class="toolbar">
  <button onclick="toggleAll(false)">全部收起</button>
  <button onclick="toggleAll(true)">全部展开</button>
  <button onclick="resetAll()">重置</button>
</div>

<div class="tips">
  🎁 <b>礼仪</b>：带礼上门 + 请吃饭，征得同意再录音。<br>
  📷 看到吊牌/包装/打包流程<b>随手拍照</b>。<br>
  💝 <b>回礼</b>：主动提出帮他做个小工具（AI/数据/自动化）。<br>
  ⏰ 拜访后 <b>24 小时内</b>整理答案发 Iris，逐条校准计划。
</div>

<div id="q"></div>

<div class="note">
  <b>📝 速记本</b>（自动保存）
  <textarea id="notes" placeholder="重要答案、供应商联系方式、档口地址记这里…"></textarea>
</div>

<div class="foot">
  <div class="big">回来后：把答案整理发 Iris 📲</div>
  40 问来自 menwear-plan-v3 §10 · 2026-09-07
</div>
</div>

<script>
const THEMES = [
 {t:"① 供应商与拿货", qs:[
  "第一批供应商怎么找到的？普宁哪个市场/档口（流沙/池尾）？有店名或联系人吗？",
  "现在固定合作几家？主力+备用怎么分配订单？",
  "判断新供应商靠不靠谱，你看什么？（走线/面料/色差/缩水）",
  "拿货价怎么谈？现金还是账期？同款会多家比价吗？",
  "供应商对次品/色差给退换或补偿吗？比例多少？",
  "吊牌合规信息（成分/执行标准/安全类别）供应商能提供吗？",
  "拿货是现货现提，还是可电话/微信下单送货？"]},
 {t:"② 先卖后拿的订单模式 ★核心", qs:[
  "完全\"出单再去拿货\"吗？有常备库存吗？备哪些款多少量？",
  "买家拍下后多久发货？下单→拿货→发出全流程几小时？",
  "供应商断码/断色怎么办？有备选方案吗？",
  "供应商接受一件代发吗？还是必须自己提货再发？",
  "爆单（活动/达人带火）怎么应对？临时加单接得住吗？",
  "周转资金大概垫多少？现金流周期（支出→回款多少天）？"]},
 {t:"③ 白牌换标 ★贴牌实操", qs:[
  "换吊牌/洗水标谁做？供应商代换还是自己换？单件人工成本？",
  "换标 MOQ 多少？商标自己的吗？R 标还是 TM？注册多久多少钱？",
  "吊牌 7 项合规谁审核？被职业打假盯过吗？怎么应对？",
  "换标后出质量问题，跟供应商责任怎么划分？",
  "做过微改款（换色/改细节）吗？值不值得？"]},
 {t:"④ 售后处理", qs:[
  "退货率多少？主因是什么（尺码/色差/质量/无理由）？",
  "运费险买吗？成本多少？值吗？",
  "退货包裹怎么验收？退回的货怎么处理（重上架/折价/报废）？",
  "遇过最棘手的售后是什么？怎么解决的？"]},
 {t:"⑤ 客服", qs:[
  "客服自己做还是请人？用什么工具？",
  "高频咨询是什么？详情页怎么预防？",
  "有话术模板吗？能分享一份吗？",
  "差评怎么处理？遇过恶意差评/职业打假吗？",
  "响应速度要求多高？晚上/凌晨订单谁管？"]},
 {t:"⑥ 快递物流", qs:[
  "用哪家快递？单均运费多少？怎么谈下来的？",
  "月结还是充值？押金多少？合同怎么签？",
  "用什么打单软件？批量发货流程能演示吗？",
  "发货超时/丢件/破损平台怎么罚？怎么防？",
  "包装袋/盒哪里买？单均包材成本多少？"]},
 {t:"⑦ 平台运营与钱 ★", qs:[
  "主做哪个平台？各平台单量占比？为什么选它？",
  "付费推广占销售额多少？ROI 多少？新手第一笔推广怎么投？",
  "起店第一波流量从哪来？第一单等了多久？",
  "真实净利率多少（扣完退货/推广/运费/包材）？盈亏平衡月销多少？",
  "个体户还是公司？报税请代账了吗？月费多少？",
  "平台罚款/扣分遇到过吗？什么原因？"]},
 {t:"⑧ 复盘与关系 ★收尾", qs:[
  "踩过最大的坑是什么？重来第一件事做什么、绝不做什么？",
  "愿不愿引荐 2–3 家普宁供应商？以后能随时请教吗？（约定回报）"]}
];

const STAR = [1,2,8,9,14,15,19,28,34,36,39,40]; // 重点标星（1-indexed 全局序号）
let total=0; THEMES.forEach(s=>total+=s.qs.length);

const $=id=>document.getElementById(id);
let idx=0;
let html='';
THEMES.forEach((sec,si)=>{
  let lis='';
  sec.qs.forEach(q=>{
    idx++;
    const star=STAR.includes(idx)?'<span class="star">★必问</span>':'';
    lis+='<li data-g="'+idx+'" onclick="tick(this)"><span class="num">'+idx+'</span><span class="ck">✓</span><span>'+q+star+'</span></li>';
  });
  html+='<section id="s'+si+'" data-total="'+sec.qs.length+'"><h2 onclick="fold('+si+')"><span class="t">'+sec.t+'<span class="badge" id="b'+si+'">0/'+sec.qs.length+'</span></span><span class="arrow">▼</span></h2><div class="body"><ol>'+lis+'</ol></div></section>';
});
$('q').innerHTML=html;

// state
let done = JSON.parse(localStorage.getItem('fs40')||'{}');
let notes = localStorage.getItem('fs40notes')||'';
$('notes').value=notes;
$('notes').addEventListener('input',()=>localStorage.setItem('fs40notes',$('notes').value));

function paint(){
  let n=0;
  THEMES.forEach((sec,si)=>{
    let c=0;
    sec.qs.forEach((q,qi)=>{
      const li=document.querySelectorAll('#s'+si+' li')[qi];
      if(done[gid(si,qi)]){li.classList.add('done');c++;}
    });
    $('b'+si).textContent=c+'/'+sec.qs.length;
    n+=c;
  });
  $('bar').style.width=(n/total*100)+'%';
  $('count').textContent='已问 '+n+' / '+total;
}
function gid(si,qi){return si+'-'+qi;}
function tick(li){
  const si=parseInt(li.parentElement.parentElement.parentElement.id.slice(1));
  const qi=Array.prototype.indexOf.call(li.parentElement.children,li);
  const k=gid(si,qi);
  done[k]=!done[k];
  if(!done[k])delete done[k];
  localStorage.setItem('fs40',JSON.stringify(done));
  paint();
}
function fold(si){const s=$('s'+si);s.classList.toggle('closed');}
function toggleAll(open){document.querySelectorAll('section').forEach(s=>{s.classList.toggle('closed',!open);});}
function resetAll(){if(confirm('确定清空所有勾选？')){done={};localStorage.setItem('fs40',JSON.stringify(done));paint();}}
paint();
</script>
</body>
</html>
